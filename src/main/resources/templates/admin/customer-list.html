<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customerマスタ管理</title>

    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>

<h1>Customerマスタ管理</h1>

<p>
    <a th:href="@{/admin/customers/new}">
        新規登録
    </a>
</p>

<p th:if="${message}"
   th:text="${message}">
</p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>顧客名</th>
        <th>メールアドレス</th>
        <th>電話番号</th>
        <th>状態</th>
        <th>操作</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="customer : ${customers}">

        <td th:text="${customer.customerId}"></td>

        <td th:text="${customer.customerName}"></td>

        <td th:text="${customer.email}"></td>

        <td th:text="${customer.phone}"></td>

        <td th:text="${customer.active == 1 ? '有効' : '無効'}">

        <td>
            <a th:href="@{/admin/customers/{id}/edit(id=${customer.customerId})}">
                編集
            </a>
        </td>
        </td>

    </tr>
    </tbody>
</table>

<p>
    <a th:href="@{/pizzas}">
        ピザ一覧へ戻る
    </a>
</p>

</body>
</html>
