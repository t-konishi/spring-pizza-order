<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注文内容確認</title>
</head>
<body>

<h1>注文内容確認</h1>

<p>
    ピザ：
    <span th:text="${pizza.pizzaName}"></span>
</p>

<p>
    単価：
    <span th:text="${pizza.price}"></span>円
</p>

<p>
    顧客：
    <span th:text="${customer.customerName}"></span>
</p>

<p>
    メールアドレス：
    <span th:text="${customer.email}"></span>
</p>

<p>
    数量：
    <span th:text="${quantity}"></span>
</p>

<p>
    合計：
    <span th:text="${total}"></span>円
</p>

<p>
    支払方法：
    <span th:switch="${orderForm.paymentMethod}">
        <span th:case="'CREDIT_CARD'">クレジットカード</span>
        <span th:case="'CASH'">現金</span>
        <span th:case="'QR'">QR決済</span>
        <span th:case="'BANK_TRANSFER'">銀行振込</span>
    </span>
</p>

<p>
    ※まだ注文は確定していません。
</p>

<form th:action="@{/orders}"
      th:object="${orderForm}"
      method="post">

    <input type="hidden"
           th:field="*{customerId}">

    <input type="hidden"
           th:field="*{pizzaId}">

    <input type="hidden"
           th:field="*{quantity}">

    <input type="hidden"
           th:field="*{paymentMethod}">

    <p>
        <button type="submit">注文を確定する</button>
    </p>

</form>

<p>
    <a th:href="@{/orders/new(pizzaId=${pizza.pizzaId})}">
        注文入力へ戻る
    </a>
</p>

</body>
</html>
