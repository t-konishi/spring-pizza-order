<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注文</title>
</head>
<body>

<h1>注文</h1>

<p>
    ピザ：
    <span th:text="${pizza.pizzaName}"></span>
</p>

<p>
    価格：
    <span th:text="${pizza.price}"></span>円
</p>

<form th:action="@{/orders}"
      th:object="${orderForm}"
      method="post">

    <input type="hidden"
           th:field="*{pizzaId}">

    <p>
        <label for="quantity">数量：</label>

        <input id="quantity"
               type="number"
               th:field="*{quantity}"
               min="1"
               max="99"
               required>

        <span th:if="${#fields.hasErrors('quantity')}"
              th:errors="*{quantity}">
    </span>
    </p>

    <p>
        <button type="submit">注文内容を確認する</button>
    </p>

</form>

<p>
    <a th:href="@{/pizzas/{id}(id=${pizza.pizzaId})}">
        ピザ詳細へ戻る
    </a>
</p>

</body>
</html>
