<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ピザメニュー</title>
</head>
<body>

<h1>ピザメニュー</h1>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>ピザ名</th>
        <th>カテゴリ</th>
        <th>価格</th>
        <th>説明</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="pizza : ${pizzas}">
        <td th:text="${pizza.pizzaId}"></td>
        <td th:text="${pizza.pizzaName}"></td>
        <td th:text="${pizza.category}"></td>
        <td th:text="${pizza.price}"></td>
        <td th:text="${pizza.description}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
